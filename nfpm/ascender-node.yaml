# nfpm package definition (https://nfpm.goreleaser.com). scripts/build-packages.sh
# renders VERSION, ARCH, BIN, SHARE, UNITS, MAINTAINER, VENDOR and HOMEPAGE into it before running nfpm.
name: ascender-node
arch: all
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: admin
priority: optional
maintainer: ${MAINTAINER}
vendor: ${VENDOR}
homepage: ${HOMEPAGE}
license: Apache-2.0
description: |
  Ascender automation platform (execution or hop node)
  Runs receptor as the ascender user from /etc/ascender/receptor/receptor.conf
  (the ascender-node service), with ansible-runner and rootless podman for
  the jobs the control plane sends over the mesh. ascender-node-apply-bundle
  installs the bundle downloaded from the instance's page in Ascender and
  starts the service. The distribution's receptor.service is masked: its
  default configuration listens on 7323 without TLS.
  On EL, ansible-runner is not packaged: install it with pip on execution
  nodes (hop nodes do not need it).
contents:
  - src: packaging/systemd/ascender-node.service
    dst: /usr/lib/systemd/system/ascender-node.service
    file_info:
      mode: 0644
  - src: packaging/bin/ascender-node-apply-bundle
    dst: /usr/bin/ascender-node-apply-bundle
    file_info:
      mode: 0755
scripts:
  postinstall: packaging/scripts/node-postinst.sh
  preremove: packaging/scripts/node-prerm.sh
  postremove: packaging/scripts/node-postrm.sh
overrides:
  deb:
    depends:
      - ascender-common (= ${VERSION}-1)
      - receptor
      - python3
      - python3-ansible-runner
      - podman
      - crun
      - fuse-overlayfs
      - slirp4netns
      - uidmap
  rpm:
    depends:
      - ascender-common = ${VERSION}-1
      - receptor
      - python3
      - podman
      - crun
      - fuse-overlayfs
      - slirp4netns
      - shadow-utils-subid
